spec:
- round: 1
  date: '2026-11-12T05:23:55Z'
  verdict: FAIL
  findings:
  - id: F-1
    classes: incapable-instrument
    finding: The guard's sed predicate is strictly weaker than the stated decode predicate — decodeURIComponent also throws on well-formed escapes whose decoded bytes are invalid UTF-8 (%FF, lone %C3), which the sed form waves through; the spec's equivalence claim was factually false, so a future %FF-named path could re-break the deploy with SC-1/SC-2 green.
    remediation: R-1 restated to the full decodeURIComponent throw surface (malformed escapes + escape-decoded bytes that are invalid UTF-8); the guard mechanism gains the UTF-8 validation half (grep -oE of escapes → printf byte emission → iconv -f UTF-8 -t UTF-8), making the guard ≡ decodeURIComponent; the Approach documents the equivalence with the corrected grounds and an ephemeral scratch sensitivity check for both branches.
  - id: F-2
    classes: gap-analysis
    finding: R-2's "same image content" clause had no verifying criterion — a rename that altered content would pass every SC.
    remediation: SC-2's instrument gains blob-hash identity across the rename (git cat-file of the pre-rename blob vs sha256sum of the new file).
  - id: F-3
    classes: fabricated-claims
    finding: Impact claimed a "featured/og image" surface; no og:image mechanism exists in this site (grep over the built tree = 0; the theme's featured_image consumers are the page template's 450x450 in-article image and post_macros' 150x150 listing thumbnails).
    remediation: Impact restated to the verified consumers, the og claim deleted.
  preferences-adjudicated: []
- round: 2
  date: '2026-11-12T05:34:42Z'
  verdict: FAIL
  findings:
  - id: F-4
    classes: fabricated-claims
    finding: The Diagnosis census figure "463 built file paths contain Cherokee syllabary/Osage script" does not reproduce under the round-2 reviewer's script-specific instruments (their count 410 files / 54 syllabary dirs). The figure originated from a non-ASCII byte-class grep whose predicate the sentence never stated; a third instrument (writer's Node full-path Unicode walk) returned 463 files / 89 dirs all-syllabary — a cross-instrument discrepancy the spec cannot carry as a precise claim.
    remediation: The illustrative script-class figures removed; the sentence restated to the sweep-based claim verified independently in both rounds and re-executed by the writer post-review (1,876 entries swept, 1,873 decode OK, exactly 3 throws = the enumerated paths). The decode-cleanliness conclusion never depended on the census figure.
  preferences-adjudicated: []
- round: 3
  date: '2026-11-12T05:44:51Z'
  verdict: FAIL
  findings:
  - id: F-5
    classes: incapable-instrument
    finding: The round-1 remediation's UTF-8 branch was still weaker than the stated predicate — grep -oE '%XX' extracts escape tokens and discards the literals between them, so a dangling lead split by a literal (x%C3x%A9) passed the described guard while decodeURIComponent throws (a multi-byte lead's continuation must immediately follow); the "exactly decodeURIComponent's throw surface" equivalence claim remained false in that corner.
    remediation: The guard mechanism corrected to run-wise validation — maximal consecutive escape runs via grep -oE '(%[0-9A-Fa-f]{2})+', each run's bytes printf-emitted and iconv-validated independently, which reproduces the decoder's adjacency requirement; R-1 states the run semantics; the writer simulation-verified guard ≡ decodeURIComponent across 22 cases (valid, malformed, invalid-UTF-8, overlong, surrogate, split-run, %25, lowercase) with zero verdict divergence before this round's dispatch.
  preferences-adjudicated: []
- round: 4
  date: '2026-11-12T05:58:49Z'
  verdict: FAIL
  findings:
  - id: F-6
    classes: incapable-instrument
    finding: glibc iconv accepts escape runs encoding code points above U+10FFFF (leads F5/F6/F7, and F4 followed by a byte >= 0x90) while decodeURIComponent throws on them — the run-wise mechanism's UTF-8 half had that one-directional blind spot (false negatives only; the reviewer's systematic lead-byte sweep found no other divergence), so the equivalence claim was still false on the target toolchain.
    remediation: The guard mechanism gains the explicit range rejection — normalize each run's hex to upper case, fail on any F5/F6/F7 byte or F4 followed by a byte >= 90 — and the scratch sensitivity check's case list gains the above-U+10FFFF cases. The writer re-simulated: guard v2 vs decodeURIComponent oracle, 30 cases (the prior 22 plus F5/F6/F7 leads, F4-90+, and the boundary-valid F4-8F-BF-BF = U+10FFFF and F4-80-80-80 = U+100000), zero verdict divergence.
  preferences-adjudicated: []
- round: 5
  date: '2026-11-12T06:22:25Z'
  verdict: FAIL
  findings:
  - id: F-7
    classes: incapable-instrument
    finding: The guard's bracket ranges are locale-collation-sensitive — under en_US.UTF-8, glibc collation places e-acute/cedilla/ae inside [a-f] and E-acute inside [A-F], so sed strips %-hex-non-ASCII fragments as valid escapes and the guard passes paths decodeURIComponent throws on (8/8 demonstrated false negatives); the equivalence claim was false on the ambient locale. Under LC_ALL=C the reviewer's independent 2,362-case battery showed zero divergence — the algorithm is sound; the defect is the unpinned locale.
    remediation: LC_ALL=C pinned for the guard's tools with the collation rationale recorded in the Approach; the sensitivity list gains a %2é-shaped case. The writer re-simulated guard v3 vs the oracle across 42 cases (prior 30 + the collation class + mixed pathological shapes) — zero divergence.
  preferences-adjudicated: []
structural-reevaluation:
- date: '2026-11-12T06:22:25Z'
  trigger: count (five revisions needed to address findings F-1 through F-7)
  outcome: Sound
  grounds: |
    Repo boundaries: single repo throughout (build.sh, one content asset, one front-matter line; filed in this repo's store) — no split. Separation of concerns: one concern (the deploy unit's URI-decodability); SC-1/SC-2/SC-3 separate detection, content state, and runtime effect without entanglement. Atomic work units: three atomic, binary-verifiable criteria. Fatness: the artifact is small; the loop's churn concentrated on one criterion's mechanism precision (the guard == decodeURIComponent equivalence), where each round surfaced a genuinely new adjacent divergence class (invalid-UTF-8 coverage, then adjacency, then >U+10FFFF, then locale collation) and each remediation fixed exactly the named finding — convergence under adversarial verification, not an artifact-shape defect; the round-5 reviewer's independent 2,362-case battery confirms the corrected mechanism reaches zero divergence under LC_ALL=C. Intent wording/reachability: stable and reachable. The artifact's structure stands; the loop resumes on the unchanged artifact.
- round: 6
  date: '2026-11-12T06:39:26Z'
  verdict: FAIL
  findings:
  - id: F-8
    classes: gap-analysis, incapable-instrument
    finding: No instrument observed the guard's activation inside build.sh — a defined-but-never-invoked guard (or one scanning the wrong directory, or with its exit swallowed) passed every SC; the base leg ran the detection pipeline extracted, and the fixed-tree leg's exit-0 is compatible with a dead guard.
    remediation: SC-1's instrument gains the integration-RED leg — the fixed ./build.sh run against the pre-fix base tree (base content, fixed build.sh only) must exit non-zero naming exactly the 3 paths — which subsumes detection, naming, wiring, and exit semantics in one observation; the extraction-based base leg retired.
  - id: F-9
    classes: incapable-instrument
    finding: R-1's branch (b) — the run-wise UTF-8 half — was exercised by no committed criterion; a guard implementing only the sed malformed-escape check satisfied SC-1/SC-2 unchanged, and the only branch-(b) check was the Approach's ephemeral unattached sensitivity note (the F-1 exposure recurred at the instrument level).
    remediation: The sensitivity battery became SC-1's branch-coverage leg — seeded cases covering every R-1 branch (valid, malformed, invalid-UTF-8, dangling lead, split runs, above-U+10FFFF, boundary-valid, collation) with verdicts equal to a decodeURIComponent oracle, executed output recorded as evidence (no longer ephemeral).
  preferences-adjudicated: []
