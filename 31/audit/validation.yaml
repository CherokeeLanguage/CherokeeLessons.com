spec:
- round: 1
  date: '2026-11-11T22:50:00Z'
  verdict: FAIL
  findings:
  - id: F-1
    classes: fabricated-claims, feasibility
    finding: Production branch named "main" — the repo's branch of record is master (verified via symref); the sibling's main was transplanted without checking, and no criterion exercised the Workers Builds production-branch configuration.
    remediation: R-2/R-6/Impact corrected to master; SC-2 gains a master-presence grep; README documents the production branch of record.
  - id: F-2
    classes: traceability, gap-analysis
    finding: The lemmatizer item's retirement half (static/CherokeeLemmatizerGwt, 194 tracked files/30 MB) was silently dropped — the work record and #30's out-of-scope both assign the item whole to this spec; only the redirect carried.
    remediation: R-4 now carries retirement + redirect with the ordering note; scope row added; SC-11 added.
  - id: F-3
    classes: fabricated-claims, cross-reference-sufficiency
    finding: michael-conrad.com characterized as "Pages generation" — it migrated to Workers Static Assets on 2026-11-11 itself (commits 0c1c626/6cebbe9, ~1h before filing).
    remediation: Provenance and Approach corrected — it is now a second assets-only precedent.
  - id: F-4
    classes: fabricated-claims, feasibility
    finding: The quoted-target mandate was an Apache mechanic transplanted to _redirects — the cited docs document unquoted fragment destinations and comments only as lines starting with #; the mandated format would produce a malformed Location.
    remediation: Quoting mandate dropped; rule written in the documented format; behavioral curl -I verification retained.
  - id: F-5
    classes: cross-reference-sufficiency
    finding: R-7 cited packageManager as the wrangler pin mechanism — the docs state Workers Builds uses the wrangler version set in package.json (a dependency entry); packageManager pins the package manager.
    remediation: Mechanism corrected to a wrangler dependency entry with an exact version.
  - id: F-6
    classes: incapable-instrument
    finding: SC-7's instrument checked only packageManager presence — a package.json without wrangler passes.
    remediation: Instrument requires an exact-version "wrangler" entry.
  - id: F-7
    classes: incapable-instrument
    finding: SC-1 verified 3 of R-1's 5 required keys (name, compatibility_date unchecked).
    remediation: Instrument extended to all five keys.
  - id: F-8
    classes: incapable-instrument
    finding: SC-5 verified 1 of 4 required headers and never the CSP.
    remediation: Instrument extended to all four headers plus CSP presence with giscus.app on the CSP line.
  - id: F-9
    classes: gap-analysis
    finding: R-2's preview-mode behavior (domain-neutral builds) and SITE_BASE_URL override were never exercised by any criterion — presence greps pass regardless of logic correctness.
    remediation: SC-12 (preview domain-neutrality, behavioral) and SC-13 (override wins, behavioral) added.
  preferences-adjudicated: []
  repo-boundary-containment: pass — single repo, home store .issues/31
- round: 2
  date: '2026-11-11T23:15:00Z'
  verdict: FAIL
  findings:
  - id: F-1
    classes: internal-contradiction
    finding: R-4's unquoted-target correction (round 1) left SC-4 titled/instrumented "quoted-fragment" and the scope table "target quoted" — the requirement's own exemplar fails its own criterion; mutually unsatisfiable.
    remediation: SC-4 retitled to documented-format with the not-a-comment + curl -I instruments; scope row aligned (unquoted per docs' example).
  - id: F-2
    classes: internal-contradiction
    finding: Round 1's R-7 fix left the scope table saying "wrangler pin via packageManager" while R-7/SC-7 demand an exact-version wrangler entry — packageManager pins the package manager, not wrangler.
    remediation: Scope row aligned to the exact-version wrangler entry.
  preferences-adjudicated: []
  repo-boundary-containment: pass — single repo, home store .issues/31
- round: 3
  date: '2026-11-11T23:45:00Z'
  verdict: FAIL
  findings:
  - id: F-1
    classes: incapable-instrument
    finding: SC-6's README instrument (any "wrangler" mention ≥1) answers a weaker question than R-6's enumerated documentation duty — a stray mention passes while the deploy-path/ops-sequence documentation is undelivered.
    remediation: Instrument extended to the enumerated elements (npx wrangler deploy, wrangler preview, GitHub App, custom domain, R2, master).
  - id: F-2
    classes: gap-analysis
    finding: The deploy trigger depends on the Workers Builds production branch being master, but the builds default is main and the ops list nowhere stated the production-branch selection step — on the stated path production builds silently become previews and the site never deploys.
    remediation: Production-branch selection (set to master) added to the sequenced ops and R-6's documented ops sequence.
  preferences-adjudicated: []
  repo-boundary-containment: pass — single repo, home store .issues/31
- round: 4
  date: '2026-11-12T00:10:00Z'
  verdict: FAIL
  findings:
  - id: F-1
    classes: incapable-instrument
    finding: SC-5's CSP check asserted giscus.app but could not detect a CSP omitting the YouTube origin — precisely the failure R-5 guards (broken post-#30 embeds); the plan-time network observation was disclosed but not carried into any criterion.
    remediation: SC-5 extended — the CSP line must carry both giscus.app and youtube (the shortcode embeds www.youtube.com/embed/, verified in templates/shortcodes/youtube.html).
  preferences-adjudicated: []
  repo-boundary-containment: pass — single repo, home store .issues/31
- round: 5
  date: '2026-11-12T00:35:00Z'
  verdict: FAIL
  findings:
  - id: F-1
    classes: gap-analysis
    finding: R-1's most design-defining clause (no Worker script, no bindings — assets-only) was stated in requirement position but exercised by no criterion; a manifest carrying main/bindings passes SC-1..SC-13.
    remediation: SC-1 extended with absence checks (no "main" entry, no "bindings" key) — consistent with the spec's own convention of instrumenting SHALL-prohibitions (R-4/R-5).
  preferences-adjudicated: []
  repo-boundary-containment: pass — single repo, home store .issues/31
- round: 6
  date: '2026-11-12T01:00:00Z'
  verdict: FAIL
  findings:
  - id: F-1
    classes: gap-analysis
    finding: R-2's "override wins in both modes" was exercised only in preview mode (SC-13) — an override honored only in the non-production branch passes every SC while violating the requirement.
    remediation: SC-14 added — production-path build with the override, override URL present in the built feed.
  - id: F-2
    classes: gap-analysis
    finding: R-4's "exactly"/only-entry constraint was unverified — SC-4 checks presence, not the entry count; the brainstorm record itself lists candidate extra entries (a live drift vector, and stray _redirects entries shadow real paths on this platform).
    remediation: SC-4 extended with the non-comment entry count = 1.
  - id: F-3
    classes: blast-radius
    finding: The README's existing publish.sh/vhost paragraph was never required to go — a passing deliverable ships contradictory deploy docs, contradicting the Impact's "the publish.sh era ends".
    remediation: R-6 scope wording extended; SC-6 gains the publish.sh-mention-absence check.
  preferences-adjudicated: []
  repo-boundary-containment: pass — single repo, home store .issues/31
- round: 7
  date: '2026-11-12T01:25:00Z'
  verdict: FAIL
  findings:
  - id: F-1
    classes: incapable-instrument, ambiguous-criterion
    finding: SC-14's "(no branch env — production path)" premise was not guaranteed — the git fallback resolves to the checkout's branch, so on a feature-branch checkout the identical command exercises preview mode (SC-13's evidence) and the criterion passes without production-mode evidence.
    remediation: Production path made deterministic — WORKERS_CI_BRANCH=master is set explicitly in the instrument.
  preferences-adjudicated: []
  repo-boundary-containment: pass — single repo, home store .issues/31
- round: 8
  date: '2026-11-12T02:00:00Z'
  verdict: FAIL
  findings:
  - id: F-1
    classes: incapable-instrument
    finding: SC-6's README enumeration omitted two of R-6's named elements — "Workers Builds" (the deploy trigger itself) and the Worker-creation step — a README omitting either passes.
    remediation: Enumeration completed (Workers Builds, worker creation).
  - id: F-2
    classes: incapable-instrument
    finding: SC-4 could not detect the quoting regression R-4's unquoted-form requirement guards against — the presence grep and the curl -I substring both match a quoted (malformed) target equally.
    remediation: Instrument anchored to the documented full-line unquoted form (quoted target fails the anchored match); entry-count and curl -I checks retained.
  preferences-adjudicated: []
  repo-boundary-containment: pass — single repo, home store .issues/31
- round: 9
  date: '2026-11-12T02:30:00Z'
  verdict: FAIL
  findings:
  - id: F-1
    classes: gap-analysis
    finding: The deploy path's build step was configured nowhere — the Workers Builds build command is optional (unset = no build) and is NOT read from the Wrangler config; the ops sequence left it unset so the first production deploy would fail or deploy nothing.
    remediation: Build-command configuration (./build.sh, dashboard-side) added to the sequenced ops and R-6's documented ops sequence; SC-6 gains the build-command documentation check.
  - id: F-2
    classes: ambiguous-criterion, gap-analysis
    finding: R-2's git fallback had no defined terminal behavior for the no-detection case (detached HEAD) — two satisfying implementations with different output; no criterion exercised the boundary.
    remediation: R-2 states the resolution (no detectable branch → production-safe, the sibling precedent's documented behavior); SC-15 added (detached-HEAD build yields production output).
  - id: F-3
    classes: incapable-instrument
    finding: SC-1 verified not_found_handling's presence but not its value — a manifest with "none" (the platform default) passes while changing the site's 404 behavior.
    remediation: Value-level check (grep '"not_found_handling": "404-page"').
  preferences-adjudicated: []
  repo-boundary-containment: pass — single repo, home store .issues/31
- round: 10
  date: '2026-11-12T03:00:00Z'
  verdict: FAIL
  findings:
  - id: F-1
    classes: cross-reference-sufficiency
    finding: The doc-attributed status-code enumeration omitted 303 (the cited redirects doc lists 301/302/303/307/308).
    remediation: Enumeration corrected.
  - id: F-2
    classes: cross-reference-sufficiency, internal-contradiction
    finding: The provenance called the one needed rule "a literal path" — R-4/SC-4 mandate a splat rule (/CherokeeLemmatizerGwt*), a distinct documented feature class.
    remediation: Reworded to "a single splat rule".
  - id: F-3
    classes: gap-analysis
    finding: The builds name-match precondition was relied on but unstated — the dashboard Worker name must equal the manifest name or builds fail; the ops sequence omitted it.
    remediation: Ops sequence and README enumeration now include Worker-created-with-the-manifest-name.
  preferences-adjudicated: []
  repo-boundary-containment: pass — single repo, home store .issues/31
- round: 11
  date: '2026-11-12T03:25:00Z'
  verdict: FAIL
  findings:
  - id: F-1
    classes: fabricated-claims
    finding: The "~1 h before this filing" elapsed-time gloss misstates fact — the migration commits are ~1h57m before the store filing commit (~3h before last write); the same-day migration, commit identities, and precedent status all verified true.
    remediation: Restated as "earlier the same day (~2 h before filing)".
  preferences-adjudicated: []
  repo-boundary-containment: pass — single repo, home store .issues/31
- round: 12
  date: '2026-11-12T04:00:00Z'
  verdict: PASS
  findings: []
  notes: fresh-context dispatch on the round-11-revised spec; reviewer verified all repo-state claims, gate evidence, sibling facts (including michael-conrad.com's same-day Workers migration), live DNS/HTTP probes, platform docs, and probed the one evidence gap (Zola 0.22.1 --base-url / behavior) from source — resolves in the spec's favor; boundary matrix SC-12–15 examined; containment pass both prongs.
